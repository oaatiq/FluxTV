# Publishes a FluxTV release that every installed FluxTV finds and installs by itself
# (README → Updates): a release APK signed with FluxTV's key, and the update.json that describes it.
#
# Run it by pushing a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# or from the Actions tab (Run workflow, with the version).
#
# Needs the repository secrets FLUXTV_KEYSTORE_BASE64 (the release keystore, base64-encoded) and
# FLUXTV_KEYSTORE_PASSWORD; FLUXTV_KEY_ALIAS defaults to fluxtv-release and FLUXTV_KEY_PASSWORD to the
# keystore password. The APK is signed with that key and the key lineage in signing/fluxtv.lineage
# (tools/sign_release.sh), which lets it update a FluxTV signed with any of the earlier keys: the
# debug keys TVs were first set up with. Android installs an update only when its key is the same or
# one the lineage proves it took over from, so this workflow stops without the keystore.
# Optionally, the repository variable FLUXTV_CERT_SHA256 (the certificate's SHA-256, as apksigner
# prints it) makes the workflow check that the APK is signed with exactly that certificate.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, for example 1.2.0 (the tag v1.2.0 is created)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the number of commits, so the whole history is needed.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then name="${INPUT_VERSION#v}"; else name="${GITHUB_REF_NAME#v}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUXTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The repository secret FLUXTV_KEYSTORE_BASE64 is not set. A release signed with another key than the TVs' FluxTV could never update them (see the top of this file)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fluxtv.keystore"
          # Read by the signing step only: Gradle signs with its own debug key, which that step replaces.
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/fluxtv.keystore" >> "$GITHUB_ENV"

      - name: Test and build
        run: >-
          bash ./gradlew --no-daemon
          :app:testDebugUnitTest :app:assembleRelease
          -PversionName=${{ steps.version.outputs.name }}

      - name: Sign with the key lineage
        env:
          FLUXTV_KEYSTORE: ${{ env.RELEASE_KEYSTORE }}
          FLUXTV_KEYSTORE_PASSWORD: ${{ secrets.FLUXTV_KEYSTORE_PASSWORD }}
          FLUXTV_KEY_ALIAS: ${{ secrets.FLUXTV_KEY_ALIAS }}
          FLUXTV_KEY_PASSWORD: ${{ secrets.FLUXTV_KEY_PASSWORD }}
        run: |
          if [ -z "$FLUXTV_KEYSTORE_PASSWORD" ]; then
            echo "::error::The repository secret FLUXTV_KEYSTORE_PASSWORD is not set (see the top of this file)."
            exit 1
          fi
          [ -n "$FLUXTV_KEY_ALIAS" ] || unset FLUXTV_KEY_ALIAS
          [ -n "$FLUXTV_KEY_PASSWORD" ] || unset FLUXTV_KEY_PASSWORD
          bash tools/sign_release.sh app/build/outputs/apk/release/app-release.apk

      - name: Check the signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.FLUXTV_CERT_SHA256 }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # Without v3 and its lineage, TVs on the older keys would refuse the update.
          if ! grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK carries no v3 signature, so no key lineage: TVs on the older keys could not update."
            exit 1
          fi
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            expected="$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
            if ! grep -q "certificate SHA-256 digest: $expected" "$RUNNER_TEMP/certs.txt"; then
              echo "::error::The APK is not signed with the certificate in FLUXTV_CERT_SHA256: no TV would install it."
              exit 1
            fi
          fi

      - name: Package
        run: |
          name="${{ steps.version.outputs.name }}"
          tag="${{ steps.version.outputs.tag }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FluxTV-$name.apk"
          python3 tools/make_update_manifest.py "dist/FluxTV-$name.apk" \
            --metadata app/build/outputs/apk/release/output-metadata.json \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/FluxTV-$name.apk" \
            --out dist/update.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          name="${{ steps.version.outputs.name }}"
          # The newest release is the one TVs read (…/releases/latest/download/update.json).
          gh release create "$tag" "dist/FluxTV-$name.apk" dist/update.json \
            --target "$GITHUB_SHA" \
            --title "FluxTV $name" \
            --generate-notes
